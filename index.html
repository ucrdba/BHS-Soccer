<!DOCTYPE html>
<html lang="en" data-ground="paper">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Soccer Program</title>
  <meta name="description"
    content="Roster, schedule and coaching tools for the soccer programme.">

  <!--
    The three faces. Cormorant Garamond and Lora are the editorial pairing
    the paper and ledger grounds use; Oswald is the touchline display face.
    Weights match what the canvas uses; every face has a real fallback in
    index.css.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Oswald:wght@300;400;500;600&display=swap">

  <link rel="stylesheet" href="./index.css">
</head>

<body>
  <!--
    The application. The title here is a placeholder: the running app sets
    document.title from the active organization, because Beaumont is the
    first organization and not the only one -- a club coach's tab should say
    their club's name.
  -->
  <div id="vue-app"></div>

  <!--
    SheetJS and JSZip, for the workbook import and export. Read off `window`
    by ImportExportModal.vue, which reports their absence rather than throwing
    -- so a missing tag here does not crash anything, it just means export
    quietly refuses. Both versions are pinned: an unpinned CDN URL changes the
    library under a deployment that was never rebuilt.
  -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script type="module" src="/src/vue-main.ts"></script>
</body>

</html>
