<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cougars Soccer</title>
  <meta name="description"
    content="Roster, schedule and coaching tools for the soccer programme.">

  <link rel="stylesheet" href="./index.css">
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <!--
    The Vue rebuild. index.html is the legacy app and is untouched until
    Phase 7; the two never share a document.
    See docs/superpowers/specs/2026-09-05-vue-phase-1-foundation-design.md.
  -->
  <div id="vue-app"></div>

  <!--
    SheetJS and JSZip, for the workbook import and export. Read off `window`
    by ImportExportModal.vue, which reports their absence rather than throwing
    -- so a missing tag here does not crash anything, it just means export
    quietly refuses. Both versions are pinned: an unpinned CDN URL changes the
    library under a deployment that was never rebuilt.
  -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script type="module" src="/src/vue-main.ts"></script>
</body>

</html>
